name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    name: Native runtime and tests
    runs-on: windows-2022
    # The first run on a cold cache builds Skia from source, which is the bulk of
    # the time. Once build/vcpkg-cache is warm this finishes in a few minutes.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      # The Unity Native Plugin API headers are not redistributed here, so the
      # runner has no Unity and CMake skips xploit_game_ui.dll. Everything the
      # engine is made of — the core, the tools and all the tests — still builds,
      # which is what this job is for. The DLL is built in release.yml.
      - name: Restore the vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: build/vcpkg-cache
          key: vcpkg-x64-windows-static-md-${{ hashFiles('native/vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-x64-windows-static-md-${{ hashFiles('native/vcpkg.json') }}-
            vcpkg-x64-windows-static-md-

      - name: Build and test
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          .\tools\build.ps1 -SkipCopy

      # Golden tests write <name>.actual.png and <name>.diff.png beside the
      # reference, which is the only way to see a rendering regression from here.
      - name: Upload golden test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: |
            native/tests/testdata/golden/*_actual.png
            native/tests/testdata/golden/*_diff.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the command-line tools
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xgu-tools-x64
          path: native/out/x64-windows-release/bin/
          retention-days: 7
