<!DOCTYPE html>
<!-- Backgrounds, border radius, borders and nesting. No text: the expected PNG
     must not depend on the fonts installed on the machine. -->
<html><head><style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; }
  body { display: flex; align-items: center; justify-content: center; }
  .panel {
    width: 280px; height: 140px;
    background: #1e2a44;
    border: 4px solid #5ac8fa;
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .square { width: 48px; height: 48px; background: #2ee59d; }
  .circle { width: 48px; height: 48px; background: #ff6b6b; border-radius: 24px; }
  .pill { width: 72px; height: 24px; background: #ffd166; border-radius: 12px; }
  .uneven {
    width: 48px; height: 48px; background: #c77dff;
    border-radius: 0 20px 0 20px;
    border: 3px solid #ffffff;
    box-sizing: border-box;
  }
</style></head>
<body>
  <div class="panel">
    <div class="square"></div>
    <div class="circle"></div>
    <div class="pill"></div>
    <div class="uneven"></div>
  </div>
</body></html>
