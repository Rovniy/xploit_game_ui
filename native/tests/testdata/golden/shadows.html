<!DOCTYPE html>
<!-- box-shadow: blurred, offset and spread, over a dark backdrop. -->
<html><head><style>
  html, body { margin: 0; width: 100%; height: 100%; background: #f2f4f8; }
  .card {
    position: absolute; width: 70px; height: 60px; background: #1e2a44; border-radius: 12px;
  }
  .soft  { left: 20px;  top: 30px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55); }
  .tight { left: 120px; top: 30px; box-shadow: 4px 4px 0 rgba(90, 200, 250, 0.9); }
  .wide  { left: 20px;  top: 110px; box-shadow: 0 0 12px 6px rgba(255, 107, 107, 0.7); }
  .none  { left: 120px; top: 110px; }
</style></head>
<body>
  <div class="card soft"></div>
  <div class="card tight"></div>
  <div class="card wide"></div>
  <div class="card none"></div>
</body></html>
