<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>HUD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hud">
    <div class="row">
      <span class="label">HP</span>
      <div class="bar"><div id="health-fill" class="fill health"></div></div>
      <span id="health-value" class="value">100</span>
    </div>
    <div class="row">
      <span class="label">AMMO</span>
      <div class="bar"><div id="ammo-fill" class="fill ammo"></div></div>
      <span id="ammo-value" class="value">30</span>
    </div>
    <div class="row buttons">
      <button id="inventory">INVENTORY</button>
      <button id="reload">RELOAD</button>
    </div>
    <div id="toast" class="toast"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
